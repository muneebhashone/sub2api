# =============================================================================
# Sub2API Docker Compose - Local Development Build
# =============================================================================
# Build from local source code for testing changes.
#
# Usage:
#   cd deploy
#   docker compose -f docker-compose.dev.yml up --build
# =============================================================================

services:
  sub2api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sub2api-dev
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1placeholder:${SERVER_PORT:-8080placeholder:8080"
    volumes:
      - ./data:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=debug
      - RUN_MODE=${RUN_MODE:-standardplaceholder
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2apiplaceholder
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is requiredplaceholder
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2apiplaceholder
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-placeholder
      - REDIS_DB=${REDIS_DB:-0placeholder
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.localplaceholder
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-placeholder
      - JWT_SECRET=${JWT_SECRET:-placeholder
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-placeholder
      - TZ=${TZ:-Asia/Shanghaiplaceholder
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres-dev
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2apiplaceholder
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is requiredplaceholder
      - POSTGRES_DB=${POSTGRES_DB:-sub2apiplaceholder
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Shanghaiplaceholder
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2apiplaceholder -d ${POSTGRES_DB:-sub2apiplaceholder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis-dev
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
    command: >
        sh -c '
          redis-server
          --save 60 1
          --appendonly yes
          --appendfsync everysec
          ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"placeholder'
    environment:
      - TZ=${TZ:-Asia/Shanghaiplaceholder
      - REDISCLI_AUTH=${REDIS_PASSWORD:-placeholder
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  sub2api-network:
    driver: bridge
