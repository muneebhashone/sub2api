version: 2

project_name: sub2api

before:
  hooks:
    - go mod tidy -C backend

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Commit={{.Commitplaceholderplaceholder
      - -X main.Date={{.Dateplaceholderplaceholder
      - -X main.BuildType=release

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName placeholderplaceholder_{{ .Version placeholderplaceholder_{{ .Os placeholderplaceholder_{{ .Arch placeholderplaceholder
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*
      - deploy/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  # 禁用自动 changelog，完全使用 tag 消息
  disable: true

# Docker images
dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version placeholderplaceholder"
      - "--label=org.opencontainers.image.revision={{ .Commit placeholderplaceholder"

  - id: arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version placeholderplaceholder"
      - "--label=org.opencontainers.image.revision={{ .Commit placeholderplaceholder"

  # GHCR images (owner must be lowercase)
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version placeholderplaceholder"
      - "--label=org.opencontainers.image.revision={{ .Commit placeholderplaceholder"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER placeholderplaceholder/{{ .Env.GITHUB_REPO_NAME placeholderplaceholder"

  - id: ghcr-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version placeholderplaceholder"
      - "--label=org.opencontainers.image.revision={{ .Commit placeholderplaceholder"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER placeholderplaceholder/{{ .Env.GITHUB_REPO_NAME placeholderplaceholder"

# Docker manifests for multi-arch support
docker_manifests:
  - name_template: "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder"
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"

  - name_template: "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:latest"
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"

  - name_template: "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Major placeholderplaceholder.{{ .Minor placeholderplaceholder"
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"

  - name_template: "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Major placeholderplaceholder"
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"

  # GHCR manifests (owner must be lowercase)
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Major placeholderplaceholder.{{ .Minor placeholderplaceholder"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Major placeholderplaceholder"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder-arm64"

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER placeholderplaceholder"
    name: "{{ .Env.GITHUB_REPO_NAME placeholderplaceholder"
  draft: false
  prerelease: auto
  name_template: "Sub2API {{.Versionplaceholderplaceholder"
  # 完全使用 tag 消息作为 release 内容（通过环境变量传入）
  header: |
    > AI API Gateway Platform - 将 AI 订阅配额分发和管理

    {{ .Env.TAG_MESSAGE placeholderplaceholder

  footer: |

    ---

    ## 📥 Installation

    **Docker:**
    ```bash
    # Docker Hub
    docker pull {{ .Env.DOCKERHUB_USERNAME placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder

    # GitHub Container Registry
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER placeholderplaceholder/sub2api:{{ .Version placeholderplaceholder
    ```

    **One-line install (Linux):**
    ```bash
    curl -sSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER placeholderplaceholder/{{ .Env.GITHUB_REPO_NAME placeholderplaceholder/main/deploy/install.sh | sudo bash
    ```

    **Manual download:**
    Download the appropriate archive for your platform from the assets below.

    ## 📚 Documentation

    - [GitHub Repository](https://github.com/{{ .Env.GITHUB_REPO_OWNER placeholderplaceholder/{{ .Env.GITHUB_REPO_NAME placeholderplaceholder)
    - [Installation Guide](https://github.com/{{ .Env.GITHUB_REPO_OWNER placeholderplaceholder/{{ .Env.GITHUB_REPO_NAME placeholderplaceholder/blob/main/deploy/README.md)
